services:
  # Backend Web Service
  - type: web
    name: civiceye-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        value: dgbrtqskx
      - key: CLOUDINARY_API_KEY
        value: 547955986139263
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: AUTO_SEED
        value: "false"

  # Frontend Static Site
  - type: web
    name: civiceye-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: civiceye-api
          property: host
